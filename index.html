<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gabriel & Ariane | Jantar de casamento</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      background-color: #ece6da;
      color: #2b2b2b;
      text-align: center;
      margin: 0;
      padding: 24px 14px 48px;
      line-height: 1.6;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
    }

    /* Cada parte do convite */
    .cartao {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 14px;
      border-radius: 4px;
      box-shadow: 0 3px 14px rgba(60, 50, 30, 0.12);
    }

    h2 {
      font-weight: normal;
      font-size: 1.5em;
      color: #6f6350;
      margin: 44px 0 16px;
    }

    .fachada {
      width: 100%;
      height: auto;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    iframe {
      width: 100%;
      height: 300px;
      border: 0;
      border-radius: 4px;
    }

    .botao {
      display: block;
      background-color: #6f6350;
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 1.05em;
      margin: 14px 0;
    }
    .botao:hover { background-color: #5a5040; }
    .botao:focus-visible {
      outline: 3px solid #2b2b2b;
      outline-offset: 3px;
    }

    /* Botão de confirmar: o destaque da página */
    .confirmar {
      background-color: #2b2b2b;
      font-size: 1.15em;
      padding: 16px 24px;
    }
    .confirmar:hover { background-color: #000000; }

    .aviso {
      font-size: 0.9em;
      color: #6f6350;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>

    <img class="cartao" src="nomes.webp"
         alt="Gabriel e Ariane. Nós casamos. E para celebrar esse momento, convidamos você para um jantar especial.">

    <img class="cartao" src="data.webp"
         alt="Dia 11 de novembro de 2026, às 20h30.">

    <img class="cartao" src="local.webp"
         alt="Churrascaria Nativas Grill. Endereço: Av. Vítor Manzini, 336, Santo Amaro, São Paulo, SP, CEP 04745-060.">

    <img class="cartao" src="mensagem.webp"
         alt="Será uma alegria compartilhar essa noite especial com você.">

    <h2>Como chegar</h2>


    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3654.3525540501937!2d-46.71077152466672!3d-23.663346978729837!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce51a3a3281843%3A0xcbd063037c5b1723!2sChurrascaria%20Nativas%20Grill%20%7C%20Santo%20Amaro%20%7C%20Restaurante%20%7C%20Rod%C3%ADzio!5e0!3m2!1spt-BR!2sbr!4v1790924391814!5m2!1spt-BR!2sbr"
            title="Mapa da Churrascaria Nativas Grill"
            allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <a class="botao"
       href="https://www.google.com/maps/search/?api=1&query=Churrascaria+Nativas+Grill+Av.+Vitor+Manzini+336+Sao+Paulo">Abrir rota no Maps</a>

    <h2>Você vem?</h2>

    <!-- Número que recebe as confirmações: 55 + DDD + número, tudo junto -->
    <a class="botao confirmar"
       href="https://wa.me/5511993977872?text=Ol%C3%A1%21%20Confirmo%20minha%20presen%C3%A7a%20no%20jantar%20de%20Gabriel%20e%20Ariane%2C%20dia%2011%2F11%2C%20%C3%A0s%2020%3A30.">Confirmar presença pelo WhatsApp</a>

    <p class="aviso">Ao tocar no botão, o WhatsApp abre com a mensagem pronta. É só enviar.</p>

  </main>
</body>
</html>
